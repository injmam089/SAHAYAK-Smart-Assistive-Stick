spring:
  datasource:
    url: jdbc:h2:mem:sahayak_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: ${JWT_TEST_SECRET:dGVzdC1vbmx5LW5vbi1wcm9kdWN0aW9uLWp3dC1oamFjLXNoYTI1Ni1zZWNyZXQta2V5LWZvci11bml0LXRlc3Rz}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info
