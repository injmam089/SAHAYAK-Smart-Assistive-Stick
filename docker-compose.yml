services:
  postgres:
    image: postgres:15-alpine
    container_name: sahayak-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sahayak_db}
      POSTGRES_USER: ${POSTGRES_USER:-sahayak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided via environment}
    volumes:
      - sahayak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sahayak_user} -d $${POSTGRES_DB:-sahayak_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sahayak_pgdata:
